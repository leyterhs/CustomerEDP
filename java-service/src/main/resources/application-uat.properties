# UAT Environment
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customeredp_db}
spring.datasource.username=${DB_USER:customer_admin}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.com.customeredp=INFO
logging.level.org.springframework.security=INFO

# JWT
jwt.secret=${JWT_SECRET:defaultSecret}
jwt.expiration=86400000