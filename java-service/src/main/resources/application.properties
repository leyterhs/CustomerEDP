spring.application.name=CustomerEDP

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/customeredp_db
spring.datasource.username=customer_admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=your_super_secret_key_that_is_at_least_256_bits_long_1234567890
jwt.expiration=86400000

# Logging
logging.level.com.customeredp=DEBUG
logging.level.org.springframework.security=DEBUG