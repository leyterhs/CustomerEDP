server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/customeredp_db?trustServerCertificate=true
spring.datasource.username=customer_admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=mySuperSecretKey12345678901234567890
jwt.expiration=86400000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

logging.level.com.customeredp=DEBUG
