services:
  postgres:
    image: postgres:16-alpine
    container_name: customeredp-db
    environment:
      POSTGRES_USER: customer_admin
      POSTGRES_DB: customeredp_db
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "password_encryption=md5", "-c", "listen_addresses=*"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: